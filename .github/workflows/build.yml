name: Build AquaHyperOS APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
    
    - name: 设置 JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: 授予 Gradlew 执行权限
      run: chmod +x gradlew
    
    - name: 接受 Android SDK 许可证
      run: yes | sdkmanager --licenses || true
    
    - name: 构建 Release APK
      run: ./gradlew assembleRelease --stacktrace --gradle-version=8.2
    
    - name: 获取版本号
      id: version
      run: echo "version=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
    
    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: AquaHyperOS-${{ steps.version.outputs.version }}
        path: app/build/outputs/apk/release/*.apk
    
    - name: 创建 Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: AquaHyperOS v${{ steps.version.outputs.version }}
        files: app/build/outputs/apk/release/*.apk
        body: |
          ## AquaHyperOS 自动构建
          
          **构建时间**: ${{ steps.version.outputs.version }}
          
          ### 功能模块
          - ✅ 核心破解（签名/权限绕过）
          - ✅ 状态栏自定义
          - ✅ 控制中心自定义
          - ✅ 锁屏功能
          - ✅ 主题美化
          - ✅ 完整日志系统
          
          ### 安装说明
          1. 下载 APK
          2. 在 LSPosed 中激活
          3. 选择作用域：android, com.android.systemui, com.android.settings
          4. 重启设备
          
          ### 集成到 ROM
          参考项目中的 `dist/FINAL_INTEGRATION_GUIDE.md`
          
          **日志位置**: `/sdcard/AquaHyperOS/logs/`
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
