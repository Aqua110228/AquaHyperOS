name: Build APK (Direct Compilation - No Xposed Runtime)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
    
    - name: 设置 JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: 安装 Android SDK
      run: |
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        mkdir -p $HOME/android-sdk/cmdline-tools
        unzip commandlinetools-linux-9477386_latest.zip -d $HOME/android-sdk/cmdline-tools
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_HOME/build-tools/30.0.3" >> $GITHUB_PATH
    
    - name: 创建 Xposed API 存根
      run: |
        mkdir -p stubs/de/robv/android/xposed
        mkdir -p libs
        mkdir -p build/stubs
        
        # 创建最小的 Xposed 接口存根
        cat > stubs/de/robv/android/xposed/IXposedHookLoadPackage.java << 'EOF'
        package de.robv.android.xposed;
        import de.robv.android.xposed.callbacks.XC_LoadPackage;
        public interface IXposedHookLoadPackage {
            void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) throws Throwable;
        }
        EOF
        
        mkdir -p stubs/de/robv/android/xposed/callbacks
        cat > stubs/de/robv/android/xposed/callbacks/XC_LoadPackage.java << 'EOF'
        package de.robv.android.xposed.callbacks;
        public class XC_LoadPackage {
            public static class LoadPackageParam {
                public String packageName;
                public ClassLoader classLoader;
            }
        }
        EOF
        
        cat > stubs/de/robv/android/xposed/XC_MethodHook.java << 'EOF'
        package de.robv.android.xposed;
        public abstract class XC_MethodHook {
            public static class MethodHookParam {
                public Object thisObject;
                public Object[] args;
                public Object result;
                public Throwable throwable;
                public void setResult(Object result) { this.result = result; }
                public Object getResult() { return result; }
            }
            protected void beforeHookedMethod(MethodHookParam param) throws Throwable {}
            protected void afterHookedMethod(MethodHookParam param) throws Throwable {}
        }
        EOF
        
        cat > stubs/de/robv/android/xposed/XposedHelpers.java << 'EOF'
        package de.robv.android.xposed;
        public class XposedHelpers {
            public static Class<?> findClass(String className, ClassLoader classLoader) { return null; }
            public static Class<?> findClassIfExists(String className, ClassLoader classLoader) { return null; }
            public static Object findAndHookMethod(Class<?> clazz, String methodName, Object... parameterTypesAndCallback) { return null; }
            public static Object findAndHookMethod(String className, ClassLoader classLoader, String methodName, Object... parameterTypesAndCallback) { return null; }
            public static Object findMethodExact(Class<?> clazz, String methodName, Class<?>... parameterTypes) { return null; }
            public static Object callMethod(Object obj, String methodName, Object... args) { return null; }
            public static Object getObjectField(Object obj, String fieldName) { return null; }
            public static void setObjectField(Object obj, String fieldName, Object value) {}
            public static boolean getBooleanField(Object obj, String fieldName) { return false; }
            public static Object newInstance(Class<?> clazz, Object... args) { return null; }
        }
        EOF
        
        cat > stubs/de/robv/android/xposed/XposedBridge.java << 'EOF'
        package de.robv.android.xposed;
        public class XposedBridge {
            public static void log(String text) {}
            public static void log(Throwable t) {}
        }
        EOF
        
        # 编译存根
        javac -d build/stubs $(find stubs -name "*.java")
        jar cf libs/xposed-api.jar -C build/stubs .
    
    - name: 下载 Kotlin 编译器
      run: |
        wget -q https://github.com/JetBrains/kotlin/releases/download/v1.8.0/kotlin-compiler-1.8.0.zip
        unzip -q kotlin-compiler-1.8.0.zip
        echo "$PWD/kotlinc/bin" >> $GITHUB_PATH
    
    - name: 下载 AndroidX Preference
      run: |
        mkdir -p libs
        echo "下载 AndroidX Preference..."
        # 使用 Google Maven Repository
        wget https://dl.google.com/android/maven2/androidx/preference/preference/1.2.0/preference-1.2.0.aar -O libs/preference.aar
        cd libs
        ls -lh preference.aar
        unzip -q preference.aar classes.jar || echo "警告：解压可能不完整"
        mv classes.jar androidx-preference.jar
        ls -lh androidx-preference.jar
    
    - name: 编译 Kotlin 源码
      run: |
        mkdir -p build/classes
        
        # 验证依赖存在
        ls -lh libs/xposed-api.jar
        
        # 编译所有 Kotlin 文件
        kotlinc \
          -classpath "$ANDROID_HOME/platforms/android-30/android.jar:libs/xposed-api.jar:libs/androidx-preference.jar" \
          -d build/classes \
          -jvm-target 1.8 \
          -verbose \
          $(find app/src/main/java -name "*.kt")
    
    - name: 编译 DEX
      run: |
        mkdir -p build/dex
        d8 \
          --lib $ANDROID_HOME/platforms/android-30/android.jar \
          --output build/dex \
          $(find build/classes -name "*.class")
    
    - name: 打包 APK
      run: |
        mkdir -p build/apk/assets
        cd build/apk
        
        # 复制 DEX
        cp ../dex/classes.dex .
        
        # 复制 xposed_init 到 assets
        cp ../../app/src/main/assets/xposed_init assets/
        echo "✅ xposed_init 已复制"
        cat assets/xposed_init
        
        # 使用 aapt 打包资源和 Manifest
        $ANDROID_HOME/build-tools/30.0.3/aapt package -f -M ../../app/src/main/AndroidManifest.xml -S ../../app/src/main/res -A assets -I $ANDROID_HOME/platforms/android-30/android.jar -F base.apk
        
        # 添加 DEX 到 APK
        $ANDROID_HOME/build-tools/30.0.3/aapt add base.apk classes.dex
        
        # 对齐
        zipalign -f 4 base.apk AquaHyperOS-aligned.apk
        
        # 生成签名密钥
        keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=AquaHyperOS"
        
        # 签名（指定 minSdkVersion）
        apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android --min-sdk-version 30 --out AquaHyperOS.apk AquaHyperOS-aligned.apk
        
        # 移动到 build 目录
        mv AquaHyperOS.apk ../../
        
        # 验证 APK
        ls -lh ../../AquaHyperOS.apk
    
    - name: 上传 APK 到 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AquaHyperOS-APK
        path: AquaHyperOS.apk
        retention-days: 90
    
    - name: 上传 APK 到 Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: 26w40c
        files: AquaHyperOS.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
