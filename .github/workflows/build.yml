name: Build APK (Direct Compilation)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
    
    - name: 设置 JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: 安装 Android SDK
      run: |
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        mkdir -p $HOME/android-sdk/cmdline-tools
        unzip commandlinetools-linux-9477386_latest.zip -d $HOME/android-sdk/cmdline-tools
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_HOME/build-tools/30.0.3" >> $GITHUB_PATH
    
    - name: 下载依赖
      run: |
        mkdir -p libs
        
        # 下载 Xposed API
        wget https://api-github.jitpack.io/com/github/rovo89/XposedBridge/82/XposedBridge-82.jar -O libs/xposed-api.jar
        
        # 下载 AndroidX Preference
        wget https://repo1.maven.org/maven2/androidx/preference/preference/1.1.1/preference-1.1.1.aar -O libs/preference.aar
        
        # 解压 AAR 获取 classes.jar
        cd libs
        unzip -q preference.aar classes.jar
        mv classes.jar preference.jar
    
    - name: 下载 Kotlin 编译器
      run: |
        wget https://github.com/JetBrains/kotlin/releases/download/v1.8.0/kotlin-compiler-1.8.0.zip
        unzip -q kotlin-compiler-1.8.0.zip
        export PATH=$PATH:$PWD/kotlinc/bin
        echo "$PWD/kotlinc/bin" >> $GITHUB_PATH
    
    - name: 编译 Kotlin 源码
      run: |
        mkdir -p build/classes
        
        # 编译所有 Kotlin 文件
        kotlinc \
          -classpath "$ANDROID_HOME/platforms/android-30/android.jar:libs/xposed-api.jar:libs/preference.jar" \
          -d build/classes \
          -jvm-target 1.8 \
          $(find app/src/main/java -name "*.kt")
    
    - name: 编译 DEX
      run: |
        mkdir -p build/dex
        
        # 使用 d8 编译成 DEX
        d8 \
          --lib $ANDROID_HOME/platforms/android-30/android.jar \
          --output build/dex \
          $(find build/classes -name "*.class")
    
    - name: 打包 APK
      run: |
        mkdir -p build/apk
        cd build/apk
        
        # 复制 DEX
        cp ../dex/classes.dex .
        
        # 复制 AndroidManifest.xml
        cp ../../app/src/main/AndroidManifest.xml .
        
        # 复制资源文件
        mkdir -p res
        cp -r ../../app/src/main/res/* res/ 2>/dev/null || true
        
        # 打包成 APK
        zip -r AquaHyperOS-unsigned.apk classes.dex AndroidManifest.xml res/
        
        # 对齐
        zipalign -f 4 AquaHyperOS-unsigned.apk AquaHyperOS-aligned.apk
        
        # 签名
        keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=AquaHyperOS"
        
        apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android --out AquaHyperOS.apk AquaHyperOS-aligned.apk
        
        mv AquaHyperOS.apk ../../
    
    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: AquaHyperOS-APK
        path: build/AquaHyperOS.apk
    
    - name: 创建 Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/AquaHyperOS.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
