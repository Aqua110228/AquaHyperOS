// 最简化的构建配置
buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    compileSdkVersion 30
    
    defaultConfig {
        minSdkVersion 30
        targetSdkVersion 30
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
    
    // 禁用所有可能导致问题的功能
    buildFeatures {
        aidl = false
        renderScript = false
        resValues = false
        shaders = false
        buildConfig = false
        viewBinding = false
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation 'androidx.preference:preference:1.1.1'
}
